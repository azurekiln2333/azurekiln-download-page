name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Check backend
        run: |
          npm ci --prefix backend
          node --check backend/server.js
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

  image:
    # 打 v* tag 时才构建并推送镜像到 GHCR，供服务器 watchtower 拉取
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image tags
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          tags=$(printf '%s' "$image:$RELEASE_TAG")
          # 预发布版本（如 v0.2.0-beta）不占用 latest
          if [ "${version#*-}" = "$version" ]; then
            tags=$(printf '%s\n%s' "$tags" "$image:latest")
          fi
          {
            echo "image=$image"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # 镜像推送成功后创建 GitHub Release，作为版本归档页
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, skipping"
            exit 0
          fi
          flags=(--verify-tag --generate-notes --title "azurekiln-download-page $RELEASE_TAG")
          # 预发布版本（如 v0.2.0-beta）标记为 prerelease
          if [[ "${RELEASE_TAG#v}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${flags[@]}"
